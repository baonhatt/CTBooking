# =============================================================================
# CINEMA WORKER — Cloudflare Workers configuration
# =============================================================================

# =============================================================================
# ENVIRONMENT: default / local
# (Dùng khi KHÔNG truyền --env, ví dụ: `wrangler dev:worker:local`, `wrangler deploy`
#  không kèm --env, hoặc làm nền tảng var/binding mặc định của toàn bộ config)
# =============================================================================
name = "cinema-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false
# No *.workers.dev address and no per-version preview URLs: the API is reached only through api.cinesphere.com.vn
# (live) and api-preview.cinesphere.com.vn (preview). The SePay webhook points at api.cinesphere.com.vn.
workers_dev = false
preview_urls = false

# -----------------------------------------------------------------------------
# Cron Triggers
# -----------------------------------------------------------------------------
[triggers]
# Chạy mỗi 2 phút: tự động chuyển booking pending quá hạn sang expired & trả lại slot voucher
# (index idx_bookings_status_expires, migration 0004, giữ mỗi lần chạy chỉ đọc các đơn đang chờ)
crons = ["*/2 * * * *"]

# -----------------------------------------------------------------------------
# Environment Variables (default / production build-time vars)
# -----------------------------------------------------------------------------
[vars]
VITE_CLIENT_BASE_URL = "https://cinesphere.com.vn"

# --- Payment gateways (VietQR/SePay) ---

# --- Email senders ---
BREVO_SENDER_EMAIL = "no-reply@cinesphere.com.vn"
BREVO_SENDER_NAME = "CINESPHERE"



# --- SEO ---
INDEXNOW_KEY = "a7f3c2e1b5d8f4a9c6e2d1b8f5a3c7e4"

# --- Media upload (Cloudinary) ---
CLOUDINARY_CLOUD_NAME = "dzp3rbeix"
CLOUDINARY_API_KEY = "818788716941232"
# CLOUDINARY_API_SECRET là Cloudflare Secret (đã cấu hình trên Dashboard)

# --- Super Admin bootstrap ---
SUPER_ADMIN_EMAIL = "admin@cinesphere.com"
SUPER_ADMIN_FULLNAME = "Super Admin"
# SUPER_ADMIN_PASSWORD là Cloudflare Secret — set qua:
#   wrangler secret put SUPER_ADMIN_PASSWORD --config worker/wrangler.toml
# KHÔNG đặt password ở đây.

# --- Security ---
TURNSTILE_SECRET = "0x4AAAAAAE1v1BW9DhZPu7hc76CmgkUo2II"

# --- SePay Webhook ---
# SEPAY_API_KEY là Cloudflare Secret — set qua:
#   wrangler secret put SEPAY_API_KEY --config worker/wrangler.toml
# Không cấu hình plain text ở mục variables.

# -----------------------------------------------------------------------------
# D1 Database (default)
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "cinema_db"
database_name = "cinema-db"
database_id = "9bae4fb3-570a-4ded-9a75-922ce4d6ef81"
migrations_dir = "migrations"

# -----------------------------------------------------------------------------
# KV Namespace (default)
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "10ffca8eeea440a0bc47527fd05fd93f"
# ============================= END: default / local ========================


# =============================================================================
# ENVIRONMENT: preview
# (Dùng khi chạy `npm run dev:worker` → wrangler dev --env preview, hoặc
#  `npm run deploy:preview` → wrangler deploy --env preview)
# =============================================================================
[env.preview]

[env.preview.placement]
mode = "smart"

# -----------------------------------------------------------------------------
# Environment Variables (preview)
# -----------------------------------------------------------------------------
[env.preview.vars]
# --- Super Admin bootstrap ---
SUPER_ADMIN_EMAIL = "admin@cinesphere.com"
SUPER_ADMIN_FULLNAME = "Super Admin"
# SUPER_ADMIN_PASSWORD là Cloudflare Secret — set qua:
#   wrangler secret put SUPER_ADMIN_PASSWORD --env preview --config worker/wrangler.toml
# KHÔNG đặt password ở đây.

VITE_CLIENT_BASE_URL = "https://preview.cinesphere.com.vn"

# --- Payment gateways (VietQR/SePay) ---

# --- Email senders ---
BREVO_SENDER_EMAIL = "no-reply@cinesphere.com.vn"
BREVO_SENDER_NAME = "CINESPHERE"



# --- SEO ---
# No INDEXNOW_KEY on preview: preview pages (real customer data) must never be submitted to search engines.

# --- Media upload (Cloudinary) ---
CLOUDINARY_CLOUD_NAME = "dzp3rbeix"
CLOUDINARY_API_KEY = "818788716941232"
# CLOUDINARY_API_SECRET set qua wrangler secret

# --- Security ---
TURNSTILE_SECRET = "0x4AAAAAAE1v1BW9DhZPu7hc76CmgkUo2II"

# -----------------------------------------------------------------------------
# D1 Database (preview)
# -----------------------------------------------------------------------------
[[env.preview.d1_databases]]
binding = "cinema_db"
database_name = "cinema-db-preview"
database_id = "fd9274ae-d1a3-42e2-b83d-2fc1bdc71caf"
migrations_dir = "migrations"
# Local dev (wrangler dev --env preview): kết nối thẳng tới D1 preview thật
# trên Cloudflare thay vì dùng SQLite local.
remote = true

# -----------------------------------------------------------------------------
# KV Namespace (preview)
# -----------------------------------------------------------------------------
# LƯU Ý: block KV này phải đặt SAU block D1 ở trên. Đặt trước D1 từng gây lỗi
# 500 hàng loạt do thứ tự khai báo trong TOML ảnh hưởng tới cách wrangler dev
# resolve nhiều remote binding trong cùng 1 environment.
# Preview has its own namespace (SETTINGS_KV_PREVIEW), not the live one: it holds the admin settings (2FA, OTP) and the
# login/OTP failure counters, so sharing it let a settings change or failed logins on preview affect live.
[[env.preview.kv_namespaces]]
binding = "SETTINGS_KV"
id = "5bc75c326020423689b30349a2b8783a"
# =============================== END: preview ===============================


# =============================================================================
# ENVIRONMENT: production
# (Dùng khi chạy `npm run deploy:prod` → wrangler deploy --config worker/wrangler.toml,
#  không truyền --env → thực chất áp dụng route + observability bên dưới)
# =============================================================================
[env.production]
routes = [
  { pattern = "cinesphere.com.vn/api/*", zone_name = "cinesphere.com.vn" },
  { pattern = "cinesphere.com.vn/uploads/*", zone_name = "cinesphere.com.vn" }
]
# ============================== END: production =============================


# =============================================================================
# OBSERVABILITY (top-level — áp dụng chung cho toàn bộ Worker, KHÔNG thuộc
# riêng env.production dù nằm phía sau trong file này)
# =============================================================================
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
send_metrics = false
enabled = true
head_sampling_rate = 1
persist = false
# ============================= END: observability ===========================