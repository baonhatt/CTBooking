# wrangler.toml – Cloudflare Pages deployment
# Dành cho next-client (Next.js), KHÔNG phải worker/wrangler.toml
# Build: npx @cloudflare/next-on-pages
# Output dir: .vercel/output/static

name = "cinema-next"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[env.preview]
[env.preview.vars]
NEXT_PUBLIC_API_URL = "https://cinema-worker-preview.baonhat20.workers.dev"
NEXT_PUBLIC_SERVER_BASE_URL = "https://cinema-worker-preview.baonhat20.workers.dev"
NEXT_PUBLIC_CLIENT_BASE_URL = "https://preview.cinema-next.pages.dev"

NEXT_PUBLIC_BACKDROP_DARK_BASE = "0.5"
NEXT_PUBLIC_BACKDROP_DARK_MIN = "0.4"
NEXT_PUBLIC_BACKDROP_DARK_MAX = "0.7"
NEXT_PUBLIC_BACKDROP_BRIGHTNESS = "0.85"
NEXT_PUBLIC_BACKDROP_BLUR = "2"

[env.production]
[env.production.vars]
NEXT_PUBLIC_API_URL = "https://api.cinesphere.com.vn"
NEXT_PUBLIC_SERVER_BASE_URL = "https://api.cinesphere.com.vn"
NEXT_PUBLIC_CLIENT_BASE_URL = "https://cinesphere.com.vn"

NEXT_PUBLIC_BACKDROP_DARK_BASE = "0.5"
NEXT_PUBLIC_BACKDROP_DARK_MIN = "0.4"
NEXT_PUBLIC_BACKDROP_DARK_MAX = "0.7"
NEXT_PUBLIC_BACKDROP_BRIGHTNESS = "0.85"
NEXT_PUBLIC_BACKDROP_BLUR = "2"
