<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- DNS Prefetch & Preconnect for critical resources -->
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://cinema-worker-preview.baonhat20.workers.dev" />
  <link rel="preconnect" href="https://cinema-worker-preview.baonhat20.workers.dev" crossorigin />

  <!-- Self-hosted fonts preload for fastest rendering -->
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />

  <!-- Critical Assets Preload (Hints for browser before JS runs) -->
  <link rel="preload" href="/logo.svg" as="image" fetchpriority="high" />


  <meta name="description"
    content="CINESPHERE - Huyễn cảnh không gian với công nghệ tiên tiến, trải nghiệm chân thực và độc đáo. Đặt vé ngay để khám phá không gian ảo tuyệt vời!" />
  <meta name="keywords" content="CINESPHERE, Huyễn cảnh không gian, công nghệ 8K, giải trí, đặt vé, Vạn Hạnh Mall" />
  <meta name="author" content="CINESPHERE" />

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="CINESPHERE - Huyễn cảnh không gian" />
  <meta property="og:description" content="Trải nghiệm công nghệ 8K độc đáo với màn hình 360° và hiệu ứng đặc biệt" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />

  <title>CINESPHERE - Huyễn cảnh không gian | Đặt Vé Ngay</title>
  <script>
    if (window.location.href === 'admin') {
      document.title = 'Admin';
    }
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4P7M6CYCHC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-4P7M6CYCHC');
  </script>
</head>

<body>
  <style>
    #root-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #050915;
    }

    #root-loader img {
      height: 48px;
      width: auto;
      opacity: 0.9;
    }

    #root-loader .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-top: 2px solid #22d3ee;
      border-bottom: 2px solid #22d3ee;
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <div id="root">
    <div id="root-loader">
      <img src="/logo.svg" alt="CINESPHERE" />
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module" src="/client/App.tsx"></script>
</body>

</html>
