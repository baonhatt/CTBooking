name: Deploy Worker (manual)
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run typecheck
      - name: Deploy Worker
        run: npx wrangler deploy --env ${{ github.event.inputs.env }} --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
